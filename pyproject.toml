[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gitacc-switcher"
version = "0.1.0"
description = "Git Account Switcher - Manage multiple Git SSH accounts easily"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["git", "ssh", "account", "switcher", "multiple", "accounts"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
gitacc = "gitacc_switcher.cli:main"

[project.urls]
Homepage = "https://github.com/ktechhub/gitacc-switcher"
Repository = "https://github.com/ktechhub/gitacc-switcher"
Issues = "https://github.com/ktechhub/gitacc-switcher/issues"

